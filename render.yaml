databases:
  - name: administrasi-desa-db
    plan: free
    databaseName: administrasi_desa
    user: administrasi_desa

services:
  - type: web
    name: administrasi-desa-nagerawe
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Administrasi Desa Nagerawe
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://administrasi-desa-nagerawe.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: administrasi-desa-db
          property: connectionString
